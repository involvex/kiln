Builds:
  - versionName: 0.2.8
    versionCode: 11
    commit: v0.2.8
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release.apk

MaintainerNotes: |
  Multi-module Gradle build. Run from the repository root. There is no settings.gradle.kts
  in app/, so do not set subdir.
  assembleRelease without the KILN_* upload-keystore env vars signs with the debug keystore.
  F-Droid re-signs the result. Do not set Binaries or AllowedAPKSigningKeys until a
  reproducible build against the GitHub Release APK is proven.
  QUERY_ALL_PACKAGES lists installed apps. REQUEST_INSTALL_PACKAGES is the system
  installer (this is a package manager). PACKAGE_USAGE_STATS is optional storage sizes
  and stays off until the user grants Usage Access. Auto-install of other apps is off
  by default and never installs a signature mismatch.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: 
  build-logic/convention/src/main/kotlin/dev/involvex/kiln/convention/KilnAndroid.kt|VERSION_CODE\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
