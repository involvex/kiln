name: CI

on:
  push:
    branches: [main, m0-setup]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for CodeQL actions/missing-workflow-permissions
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Spotless
        run: ./gradlew spotlessCheck --no-daemon

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      # Warm KSP/compile classpaths before lint. Parallel cold KSP/Hilt has flaked with
      # "Context could not be resolved" / unresolved inject types (e.g. :feature:storage
      # run 43853997864; :feature:debloat PrivilegedExecutor on PR #66 run 43881626481).
      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon --no-parallel

      - name: Lint
        run: ./gradlew lint --no-daemon --no-parallel

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Hilt ViewModel map
        run: ./gradlew verifyHiltViewModelMapDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kiln-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
