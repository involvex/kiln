name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      # secrets.* cannot be used in `if:` — map to env and branch in the shell
      - name: Decode upload keystore
        env:
          KILN_STORE_FILE_BASE64: ${{ secrets.KILN_STORE_FILE_BASE64 }}
          KILN_STORE_PASSWORD: ${{ secrets.KILN_STORE_PASSWORD }}
          KILN_KEY_ALIAS: ${{ secrets.KILN_KEY_ALIAS }}
          KILN_KEY_PASSWORD: ${{ secrets.KILN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KILN_STORE_FILE_BASE64 KILN_STORE_PASSWORD KILN_KEY_ALIAS KILN_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "GitHub Releases require all four KILN_* upload-keystore secrets (see docs/RELEASE.md)."
            exit 1
          fi
          echo "$KILN_STORE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/kiln-upload.jks"
          echo "KILN_STORE_FILE=$RUNNER_TEMP/kiln-upload.jks" >> "$GITHUB_ENV"

      - name: Quality gates
        run: ./gradlew spotlessCheck detekt lint testDebugUnitTest --no-daemon

      - name: Assemble release
        env:
          KILN_STORE_PASSWORD: ${{ secrets.KILN_STORE_PASSWORD }}
          KILN_KEY_ALIAS: ${{ secrets.KILN_KEY_ALIAS }}
          KILN_KEY_PASSWORD: ${{ secrets.KILN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Package and verify APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$SRC"
          DEST="$RUNNER_TEMP/kiln-${VERSION}.apk"
          cp "$SRC" "$DEST"

          SEARCH_ROOTS=()
          [ -n "${ANDROID_HOME:-}" ] && SEARCH_ROOTS+=("$ANDROID_HOME")
          [ -n "${ANDROID_SDK_ROOT:-}" ] && SEARCH_ROOTS+=("$ANDROID_SDK_ROOT")
          SEARCH_ROOTS+=("$HOME/Android/Sdk" "$HOME/.android/sdk")
          APKSIGNER=""
          for root in "${SEARCH_ROOTS[@]}"; do
            if [ -d "$root/build-tools" ]; then
              candidate=$(find "$root/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
              if [ -n "$candidate" ]; then
                APKSIGNER="$candidate"
                break
              fi
            fi
          done
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find "${HOME}/.gradle" "${ANDROID_HOME:-/nonexistent}" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found (ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset})"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$DEST"

          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=kiln-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Kiln **${{ steps.apk.outputs.version }}** — upload-keystore signed APK (`${{ steps.apk.outputs.name }}`).

            See [CHANGELOG.md](https://github.com/involvex/kiln/blob/main/CHANGELOG.md) for details.
            Privacy: [docs/PRIVACY.md](https://github.com/involvex/kiln/blob/main/docs/PRIVACY.md).
            Docs site: https://involvex.github.io/kiln/
            Signing: [docs/RELEASE.md](https://github.com/involvex/kiln/blob/main/docs/RELEASE.md).
