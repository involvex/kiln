name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Decode upload keystore
        if: ${{ secrets.KILN_STORE_FILE_BASE64 != '' }}
        env:
          KILN_STORE_FILE_BASE64: ${{ secrets.KILN_STORE_FILE_BASE64 }}
        run: |
          echo "$KILN_STORE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/kiln-upload.jks"
          echo "KILN_STORE_FILE=$RUNNER_TEMP/kiln-upload.jks" >> "$GITHUB_ENV"

      - name: Quality gates
        run: ./gradlew spotlessCheck detekt lint testDebugUnitTest --no-daemon

      - name: Assemble release
        env:
          KILN_STORE_PASSWORD: ${{ secrets.KILN_STORE_PASSWORD }}
          KILN_KEY_ALIAS: ${{ secrets.KILN_KEY_ALIAS }}
          KILN_KEY_PASSWORD: ${{ secrets.KILN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Resolve APK path
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            See [CHANGELOG.md](https://github.com/involvex/kiln/blob/main/CHANGELOG.md) for details.
            Privacy: [docs/PRIVACY.md](https://github.com/involvex/kiln/blob/main/docs/PRIVACY.md).
            If upload-keystore secrets were not set, this APK is **debug-signed** for sideload only (see docs/RELEASE.md).
