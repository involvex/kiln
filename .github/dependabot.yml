# Keep Gradle catalogs and GitHub Actions on a weekly cadence.
# Transitive CVE floors for the AGP classpath live in
# gradle/kiln.security-pins.settings.gradle.kts (and libs.versions.toml).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      gradle-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      gradle-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
