distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.0-bin.zip
# Dependency Submission / cold CI clones hit flaky services.gradle.org (504 / short timeouts).
# Default wrapper is 10s + 0 retries ("Attempt 1/1"); raise both so validate-project can recover.
networkTimeout=60000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
